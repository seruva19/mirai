[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mirai"
version = "0.1.0"
description = "LoRA trainer and native inference for sparse-MoE video diffusion models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.8",
    "torchvision>=0.23",
    "safetensors>=0.7.0",
    "einops>=0.7.0",
    "transformers==5.5.0",
    "fla-core==0.5.2",
    "pydantic-settings==2.14.1",
    "unfoldNd==0.2.3",
    "ftfy>=6.0.0",
    "regex>=2024.0.0",
    "numpy>=1.26",
    "pillow>=10.0.0",
    "opencv-python>=4.9.0",
    "zstandard>=0.23.0",
    "psutil>=7.0",
]

[project.optional-dependencies]
telemetry = [
    "tensorboard>=2.19.0",
    "wandb>=0.18",
]
preview = [
    "av>=12.0.0",
]
tools = [
    "requests>=2.32.0",
]
magi2-preview = [
    # Fused multi-head MoE kernels in the vendored native transformer.
    "triton>=3.0.0; sys_platform == 'linux'",
    # Shard-loading and sampler progress reporting.
    "tqdm>=4.66.0",
    # Audio-feature resampling in the vendored inference engine.
    "scipy>=1.11.0",
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "ruff==0.14.8",
]

[project.urls]
Repository = "https://github.com/seruva19/mirai"

[tool.setuptools.packages.find]
include = ["mirai*"]
exclude = ["mirai.*.contracts", "mirai.*.contracts.*"]

[tool.setuptools.package-data]
"mirai.config" = ["defaults/*.toml", "presets/*.toml"]
"mirai.vendors.lingbot_video" = ["LICENSE"]
"mirai.vendors.qwen3_moe_fused" = ["LICENSE"]
"mirai.vendors.magi2_preview" = ["LICENSE", "configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "mirai"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "production_contract: verifies the supported sparse-MoE native production contract",
    "moe_contract: exercises sparse-MoE training contracts",
    "native_smoke: gated real-asset native smoke verification",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["**/__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E702",
    "E731",
    "E741",
    "B006",
    "B007",
    "B009",
    "B010",
    "B017",
    "B027",
    "B904",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"mirai/core/models/compressed_weights/**" = ["F401"]
"mirai/vendors/**" = ["E401", "E402", "E712", "F401", "F811", "F821", "F841", "B008", "B011"]
"scripts/**" = ["E402", "F401", "F841"]
"tests/**" = ["F401", "F841"]
"**/contracts/**" = ["F401", "F841"]

[tool.pyright]
include = ["mirai"]
exclude = ["**/__pycache__", "mirai/vendors", "mirai/**/contracts", "tests", "tools", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "warning"
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"
reportIndexIssue = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportOperatorIssue = "warning"
reportRedeclaration = "warning"
reportPossiblyUnboundVariable = "warning"
reportSelfClsParameterName = "warning"
reportInvalidTypeForm = "warning"
reportInvalidStringEscapeSequence = "warning"
reportUndefinedVariable = "error"
