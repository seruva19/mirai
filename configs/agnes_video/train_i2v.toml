[model]
type = "agnes-video"
path = "./models/agnes-video"

[strategy]
type = "image_to_video"

[strategy.params]
first_frame_conditioning_p = 1.0

[training]
max_steps = 1000
gradient_checkpointing = "standard"
blocks_to_swap = 0

[adapter]
type = "lora"
target_preset = "attn_mlp"
rank = 32
alpha = 32.0

[dataset]
path = "./data/videos"
auto_preprocess_cache = true
preprocess_raw_media_to_pt = true
enable_bucketing = true
frame_buckets = [17, 33]
bucket_resolutions = ["256x448"]

[memory]
frozen_weight_quantization = "none"
weight_residency_strategy = "disabled"

[logging]
output_dir = "./outputs/agnes_video_i2v_lora"
save_every_n_steps = 100
sample_solver = "unipc"
sample_frame_count = 121
