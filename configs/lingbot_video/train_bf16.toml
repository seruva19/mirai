preset = "lingbot_video"

[model]
path = "./models/lingbot-video-moe-30b-a3b"

[training]
max_steps = 1000
gradient_checkpointing = "aggressive"
block_swap_mode = "sync"
blocks_to_swap = 0

[adapter]
type = "lora"
target_preset = "attn_router_routed_experts"
rank = 32
alpha = 32.0

[dataset]
path = "./data/videos"
auto_preprocess_cache = true
preprocess_raw_media_to_pt = true
enable_bucketing = true
frame_buckets = [17, 33]

[memory]
frozen_weight_quantization = "none"
frozen_weight_quantization_strategy = "disabled"
quantize_experts_on_load = false
expert_weight_access = "disabled"
expert_dequant_chunk_size = 0
weight_residency_strategy = "disabled"
cuda_memory_fraction = 0.95

[logging]
output_dir = "./outputs/lingbot_lora_bf16"
save_every_n_steps = 100
