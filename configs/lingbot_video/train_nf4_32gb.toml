# LingBot Video LoRA training with 128 GiB RAM and 32 GiB VRAM.
preset = "lingbot_video"

[model]
path = "./models/lingbot-video-moe-30b-a3b"

[training]
batch_size = 1
gradient_accumulation = 2
max_steps = 1000
gradient_checkpointing = "aggressive"
block_swap_mode = "async"
blocks_to_swap = 16

[optimizer]
type = "paged_adamw_8bit"
allow_fallback = false

[adapter]
type = "lora"
target_preset = "attn_router_routed_experts"
rank = 32
alpha = 32.0

[dataset]
path = "./data/videos"
auto_preprocess_cache = true
preprocess_raw_media_to_pt = true
enable_bucketing = true
frame_buckets = [17, 33]

[memory]
frozen_weight_quantization = "nf4"
frozen_weight_quantization_strategy = "compressed_weights"
quantize_experts_on_load = true
expert_weight_access = "chunked_dequant"
expert_dequant_chunk_size = 32
weight_residency_strategy = "block_swap"
block_swap_prefetch_depth = 1
max_pinned_host_gib = 16.0
# A workstation GPU also drives the desktop; leave allocator headroom.
cuda_memory_fraction = 0.95
# Free-RAM guard for the host side of caching and checkpoint writes.
minimum_system_memory_gib = 16.0

[logging]
output_dir = "./outputs/lingbot_lora_nf4_32gb"
save_every_n_steps = 100
