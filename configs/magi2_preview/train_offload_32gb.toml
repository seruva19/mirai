# MAGI-2 Preview LoRA training on a 32 GiB device with a 256 GiB host.
#
# The 114B-A6B BF16 checkpoint is larger than the host budget minus the
# operating system, so every value below is a requirement of that host, not a
# tuning preference. The profile has no room for a second host copy of the
# transformer. This is the BF16 profile; a host that cannot hold the released
# expert stack should use configs/magi2_preview/train_nf4.toml, which packs the
# routed experts while the checkpoint is read.
preset = "magi2_preview_offload"

[model]
path = "./models/MAGI-2-preview"

[training]
# One sample per step. The preset leaves the schema default (2), which doubles
# every activation buffer on a device that cannot absorb it.
batch_size = 1
# All 40 preview blocks stream from host RAM: no block set stays resident.
blocks_to_swap = 40
# Synchronous transfer. The incoming block copy completes before the block
# computes, so exactly one swapped block occupies the device at a time and no
# transfer stream holds a second staging buffer.
block_swap_mode = "sync"
# The vendored block exposes one whole-block recompute switch; "standard" is
# the only recompute mode this family implements.
gradient_checkpointing = "standard"

[adapter]
type = "lora"
# Attention-only targets. `attn_router` additionally trains the router
# projection, and this family emits no routing-health signal to observe that
# with.
target_preset = "attn_only"
rank = 8
alpha = 8.0

[dataset]
path = "./data/videos"
auto_preprocess_cache = true
preprocess_raw_media_to_pt = true
enable_bucketing = true
# Frame counts are trimmed to 8n + 1 by the native cache path; 25 is the
# largest such count this profile budgets activations for.
frame_buckets = [25]
# (H, W). 448 wide bounds the token count of the sparse-MoE layers.
bucket_resolutions = ["256x448"]

[memory]
# Free-RAM guard, not a total-RAM requirement: the run aborts when available
# host memory falls below this. The host-resident transformer consumes most of
# a 256 GiB machine, so the guard is a small operating-system reserve.
minimum_system_memory_gib = 12.0
# Page-locked host ceiling. The pinned budget is
# min(free_ram - minimum_system_memory_gib, this), and on this host the free
# remainder is what bounds it; a large ceiling would only invite page-locking
# memory the machine needs for the weights themselves.
max_pinned_host_gib = 8.0

[logging]
output_dir = "./outputs/magi2_preview_lora_32gb"
save_every_n_steps = 100
# Preview sampling is off by default; these hold the values this family
# accepts. UniPC is the only solver the native sampler implements, and 57 is
# the floor of its generation envelope (latent T 8).
sample_solver = "unipc"
sample_frame_count = 57
