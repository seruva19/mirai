name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full suite (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: static + public contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.14.8

      - name: Ruff static gate
        run: ruff check .

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Publication and config contracts
        run: >-
          python -m pytest
          tests/test_publication_contract.py
          tests/test_config_reference_coverage.py -q

      - name: Production contracts
        run: >-
          python -m pytest
          mirai/core/models/adapters/contracts/host.py
          -q -m production_contract

  full:
    name: full CPU suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.14.8

      - name: Ruff static gate
        run: ruff check .

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Full manifest-driven CPU suite
        run: python scripts/agent/check.py --all-local --run --max-cost extended

  windows-smoke:
    name: Windows config + publication smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Validate Windows-facing config and publication surfaces
        run: >-
          python -m pytest
          tests/test_config.py
          tests/test_config_reference_coverage.py
          tests/test_publication_contract.py -q
